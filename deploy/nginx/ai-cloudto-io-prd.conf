# ========================================
# Nginx Configuration - Production Environment
# Domain: ai.cloudto.io
# Port: 3000
# ========================================

# Upstream 配置
upstream prd_backend {
    server 127.0.0.1:3000;
    keepalive 64; # 生產環境使用更多長連接
}

# Rate limiting zone（防止濫用）
limit_req_zone $binary_remote_addr zone=prd_limit:20m rate=20r/s;

server {
    listen 80;
    server_name ai.cloudto.io;

    # 限制請求大小
    client_max_body_size 10M;

    # 主要代理設定
    location / {
        # Rate limiting
        limit_req zone=prd_limit burst=40 nodelay;

        # Proxy 設定
        proxy_pass http://prd_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout 設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ONNX 模型檔案（長期快取）
    location /models/ {
        proxy_pass http://prd_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # WASM 檔案（長期快取）
    location /wasm/ {
        proxy_pass http://prd_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # API 不快取
    location /api/ {
        proxy_pass http://prd_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://prd_backend;
        access_log off; # 健康檢查不記錄日誌
    }
}

# ========================================
# 部署說明：
# 1. 複製此檔案到伺服器：
#    scp deploy/nginx/ai-cloudto-io-prd.conf 165.154.226.78:/tmp/
#
# 2. SSH 到伺服器：
#    ssh 165.154.226.78
#
# 3. 移動到 Nginx 配置目錄：
#    sudo mv /tmp/ai-cloudto-io-prd.conf /etc/nginx/sites-available/
#
# 4. 創建符號連結：
#    sudo ln -s /etc/nginx/sites-available/ai-cloudto-io-prd.conf /etc/nginx/sites-enabled/
#
# 5. 測試配置：
#    sudo nginx -t
#
# 6. 重新載入 Nginx：
#    sudo systemctl reload nginx
# ========================================
